[package]
name = "nocodo-agent"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
jiff.workspace = true
nocodo-types.workspace = true
rig-agent = "0.43"
rig-core = { version = "0.43", default-features = false, features = ["derive", "reqwest", "native-tls"] }
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror = "2"
tokio = { version = "1", features = ["time"] }
uuid = { version = "1.27.0", features = ["v7"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros", "time"] }
insta = "1.49.0"
rig-core = { version = "0.43", default-features = false, features = ["test-utils"] }
