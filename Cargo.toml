[workspace]
members = ["backend", "shared-types", "agents", "schema-codegen", "nocodo_praxis"]
exclude = ["gui"]
resolver = "2"

[workspace.dependencies]
actix-web = "4.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ts-rs = "10.1"

[profile.dev]
debug = 0
incremental = true
codegen-units = 256

[profile.dev.package."*"]
debug = 0
opt-level = 0
